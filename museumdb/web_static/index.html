  <div class="app">
    <div class="scrim" data-close-drawer hidden></div>
    <nav class="drawer" id="drawer" aria-label="Şehirler">
      <div class="brand">
        <span class="brand-mark">travelkardi</span>
        <span class="brand-sub">Müze süreleri</span>
      </div>
      <label class="search">
        <svg class="icon"><use href="#i-search"/></svg>
        <input id="city-search" type="search" placeholder="Şehir ya da ülke ara" autocomplete="off">
      </label>
      <div id="city-nav" class="city-nav"></div>
      <p class="drawer-foot" id="drawer-foot"></p>
    </nav>

    <main class="main" id="main">
      <div class="topbar">
        <button class="icon-btn" data-open-drawer aria-label="Şehir listesini aç" aria-controls="drawer">
          <svg class="icon"><use href="#i-menu"/></svg>
        </button>
        <span class="topbar-title" id="topbar-title"></span>
      </div>
      <div id="view"></div>
    </main>

    <div class="sheet-scrim" data-close-sheet hidden></div>
    <aside class="sheet" id="sheet" aria-label="Müze ayrıntıları" hidden>
      <div class="sheet-head">
        <button class="icon-btn" data-close-sheet aria-label="Ayrıntıları kapat">
          <svg class="icon"><use href="#i-close"/></svg>
        </button>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
    </aside>
  </div>

  <script src="app.js"></script>
